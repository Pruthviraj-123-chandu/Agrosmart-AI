<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroVision Pro</title>
    <script>
      // Forcefully suppress Vite WebSocket/HMR errors in the preview environment
      (function() {
        const isBenignError = (msg) => 
          msg && typeof msg === 'string' && (
            msg.includes('WebSocket') || 
            msg.includes('vite') || 
            msg.includes('HMR') ||
            msg.includes('hot-reload') ||
            msg.includes('closed without opened') ||
            msg.includes('connection failed') ||
            msg.includes('failed to connect')
          );

        window.addEventListener('unhandledrejection', function(event) {
          const msg = event.reason?.message || String(event.reason);
          if (isBenignError(msg)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isBenignError(event.message) || isBenignError(event.error?.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Silent console errors/warnings for these specific logs
        const orgError = console.error;
        const orgWarn = console.warn;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && isBenignError(args[0])) return;
          if (args[0] && args[0].message && isBenignError(args[0].message)) return;
          orgError.apply(console, args);
        };
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && isBenignError(args[0])) return;
          orgWarn.apply(console, args);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
