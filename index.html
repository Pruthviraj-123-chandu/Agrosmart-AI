<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // Forcefully suppress Vite WebSocket/HMR errors in the preview environment
      (function() {
        const isBenignError = (msg) => 
          msg && (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('HMR'));

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && isBenignError(String(event.reason.message || event.reason))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isBenignError(event.message)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Also silencer console.error for these specific logs to keep the console clean
        const orgError = console.error;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && isBenignError(args[0])) return;
          orgError.apply(console, args);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
